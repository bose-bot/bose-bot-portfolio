<style>
/* Layout: a playing 3D "film" as the hero, then reels laid out like shipping manifests, a route-line process, and a short contact block. */
:root{
  --paper:#EEF1F5;      /* cool depot concrete */
  --panel:#FFFFFF;
  --ink:#0E1B2C;        /* night navy */
  --ink-2:#4A5A70;
  --line:#CBD3DD;
  --signal:#FF5A14;     /* safety orange */
  --route:#0F9C8F;      /* route teal */
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --deep:#0E1B2C; --deep-2:#13243A; --deep-line:#24384F;
  --on-deep:#EEF1F5; --on-deep-2:#A9B6C7; --on-deep-3:#7F90A6;
  --gutter:clamp(16px,4vw,48px);
  color-scheme:light;
}
:root[data-palette="dusk"]{
  --paper:#F4E8DF; --panel:#FFF9F4; --ink:#1D1B33; --ink-2:#66607A; --line:#E3CFC2; --signal:#EE5216; --route:#0E8A80;
  --deep:#1D1B33; --deep-2:#28253F; --deep-line:#3B3758; --on-deep:#F4E8DF; --on-deep-2:#C4BACB; --on-deep-3:#938BA5;
}
:root[data-palette="night"]{
  --paper:#0B1424; --panel:#12213A; --ink:#E8EEF6; --ink-2:#9AAAC0; --line:#26394F; --signal:#FF6B2C; --route:#2AD4C0;
  --deep:#050B16; --deep-2:#0F1C30; --deep-line:#1F3049; --on-deep:#E8EEF6; --on-deep-2:#A3B2C6; --on-deep-3:#7286A0;
  color-scheme:dark;
}
body,.nav,.manifest,.screen,.label,.fx-score,.note-card{transition:background-color .5s,color .5s,border-color .5s}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.wrap{padding-inline:var(--gutter);max-width:1440px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.nav-in{display:flex;align-items:center;gap:24px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-stretch:115%;font-size:17px;letter-spacing:-.01em}
.logo svg{flex:none}
.nav-links{display:flex;gap:22px;margin-left:auto}
.nav-links a{text-decoration:none;font-size:14px;color:var(--ink-2)}
.nav-links a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 14px/1 var(--f-body);padding:13px 18px;border-radius:3px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:10px 14px;font-size:13px}
@media (max-width:720px){.nav-links{display:none}.nav .btn{margin-left:auto}}

/* hero */
.hero{position:relative;height:clamp(620px,90vh,940px);overflow:hidden;border-bottom:1px solid var(--line)}
.hero-stage{position:absolute;inset:0}
.hero-stage canvas{width:100%;height:100%;display:block}
.hero-veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--paper) 94%,transparent) 0%,color-mix(in srgb,var(--paper) 72%,transparent) 30%,transparent 56%),linear-gradient(0deg,color-mix(in srgb,var(--paper) 90%,transparent) 0%,transparent 22%)}
.hero-copy{position:absolute;top:118px;left:0;right:0;pointer-events:none}
.hero-copy > div{max-width:600px;pointer-events:auto}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--ink-2);margin-bottom:22px}
.eyebrow i{width:22px;height:2px;background:var(--signal);display:block}
.hero h1{font-size:clamp(2.7rem,6.2vw,5.6rem);font-weight:850;font-stretch:120%;line-height:.93;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--signal)}
.hero-lede{max-width:46ch;font-size:clamp(16px,1.3vw,18px);color:var(--ink-2);margin:22px 0 28px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}

.manifest{position:absolute;top:96px;right:var(--gutter);width:330px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:4px;box-shadow:0 18px 40px -24px rgba(14,27,44,.35)}
.manifest-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--route)}
.live b{width:7px;height:7px;border-radius:50%;background:var(--route);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,156,143,.5)}100%{box-shadow:0 0 0 8px rgba(15,156,143,0)}}
.feed{list-style:none;margin:0;padding:4px 0}
.feed li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 14px;border-bottom:1px dashed var(--line);animation:feedIn .5s ease-out}
.feed li:last-child{border-bottom:0}
@keyframes feedIn{from{background:color-mix(in srgb,var(--signal) 14%,transparent)}to{background:transparent}}
.feed .t{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.feed .id{font-family:var(--f-mono);font-size:12px;font-weight:500;text-align:right}
.feed .st{grid-column:1/-1;font-size:13px;display:flex;gap:8px;align-items:center;min-width:0}
.feed .st span{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:2px;flex:none;background:var(--signal)}
.dot.done{background:var(--route)}

.hero-bar{position:absolute;left:0;right:0;bottom:22px}
.caption{display:flex;gap:14px;align-items:baseline;margin-bottom:12px;flex-wrap:wrap}
.caption strong{font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:.06em}
.caption span{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.player{display:flex;align-items:center;gap:14px}
.play{width:42px;height:42px;flex:none;border-radius:50%;border:1.5px solid var(--ink);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.play:hover{background:var(--ink);color:var(--paper)}
.segs{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;min-width:0}
.seg{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink-2);min-width:0}
.seg .track{display:block;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.seg .fill{display:block;height:100%;width:0;background:var(--ink)}
.seg.on .fill{background:var(--signal)}
.seg .lbl{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.on .lbl{color:var(--ink)}
.tc{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}

@media (max-width:980px){.manifest{display:none}}
@media (max-width:820px){
  .hero{height:auto;display:flex;flex-direction:column;padding-top:64px}
  .hero-copy{position:static;order:1;padding-block:36px 24px}
  .hero-stage{position:relative;order:2;height:clamp(300px,78vw,520px)}
  .hero-veil{display:none}
  .hero-bar{position:static;order:3;padding-block:16px 26px}
  .seg .lbl{display:none}
}

/* sections */
section.block{padding-block:clamp(72px,10vw,140px)}
.sec-hd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:end;margin-bottom:clamp(40px,6vw,80px)}
.sec-hd h2{font-size:clamp(2.1rem,4.6vw,4rem);font-weight:800;font-stretch:115%;line-height:.98;letter-spacing:-.02em}
.sec-hd p{color:var(--ink-2);max-width:46ch;margin:0;justify-self:end}
@media (max-width:820px){.sec-hd{grid-template-columns:1fr}.sec-hd p{justify-self:start}}

/* work */
.reels{display:flex;flex-direction:column;gap:clamp(64px,9vw,120px)}
.reel{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center}
.screen{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen .tag{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:2px;background:var(--panel);color:var(--ink)}
.chip.live3d{background:var(--ink);color:var(--paper);display:inline-flex;gap:6px;align-items:center}
.chip.live3d b{width:6px;height:6px;border-radius:50%;background:var(--signal)}
.meta{min-width:0}
.meta .client{color:var(--ink-2);margin-bottom:14px}
.meta h3{font-size:clamp(1.8rem,3.2vw,2.7rem);font-weight:780;font-stretch:112%;line-height:1;letter-spacing:-.015em;margin-bottom:18px}
.meta p{color:var(--ink-2);max-width:48ch;margin:0 0 26px}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1.5px solid var(--ink);margin:0}
.spec div{padding:12px 0;border-bottom:1px solid var(--line)}
.spec dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.spec dd{margin:4px 0 0;font-weight:500;font-variant-numeric:tabular-nums}
.deliver{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.deliver li{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:2px;background:var(--panel)}
@media (max-width:860px){.reel{grid-template-columns:1fr}.reel:nth-child(even) .screen{order:0}}

/* process */
.process{background:var(--deep);color:var(--on-deep)}
.process .sec-hd p{color:var(--on-deep-2)}
.route{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.route::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:repeating-linear-gradient(90deg,var(--deep-line) 0 10px,transparent 10px 18px)}
.route::after{content:"";position:absolute;top:4px;left:0;width:26px;height:12px;border-radius:2px;background:var(--signal);animation:haul 14s linear infinite}
@keyframes haul{from{left:0}to{left:calc(100% - 26px)}}
.stop .org{color:var(--on-deep);font-weight:500;margin:0 0 12px}
.stop ul{margin:0;padding-left:18px;color:var(--on-deep-2);font-size:14px;display:grid;gap:6px}
.stop{position:relative;padding-top:38px;min-width:0}
.stop::before{content:"";position:absolute;top:2px;left:0;width:16px;height:16px;border-radius:50%;background:var(--deep);border:2px solid var(--on-deep)}
.stop .n{font-family:var(--f-mono);font-size:12px;color:var(--signal);letter-spacing:.08em}
.stop h3{font-size:1.25rem;font-weight:750;font-stretch:110%;margin:8px 0 8px;line-height:1.1}
.stop p{margin:0;font-size:14px;color:var(--on-deep-2)}
.stop .wk{display:block;margin-top:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-deep-3)}
@media (max-width:980px){
  .route{grid-template-columns:1fr;gap:28px;padding-left:34px}
  .route::before{top:0;bottom:0;left:7px;right:auto;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--deep-line) 0 10px,transparent 10px 18px)}
  .route::after{left:2px;top:0;width:12px;height:26px;animation-name:haulV}
  @keyframes haulV{from{top:0}to{top:calc(100% - 26px)}}
  .stop{padding-top:0}
  .stop::before{left:-34px}
}
@media (prefers-reduced-motion:reduce){.route::after,.live b{animation:none}.feed li{animation:none}}

/* capabilities */
.caps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1.5px solid var(--ink)}
.cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:baseline}
.caps .cap:nth-child(odd){padding-right:32px}
.caps .cap:nth-child(even){padding-left:32px;border-left:1px solid var(--line)}
.cap h3{font-size:1.35rem;font-weight:720;font-stretch:108%}
.cap p{grid-column:1/-1;margin:0;color:var(--ink-2);font-size:15px;max-width:52ch}
.cap .fmt{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);letter-spacing:.06em;text-align:right}
@media (max-width:820px){.caps{grid-template-columns:1fr}.caps .cap:nth-child(odd),.caps .cap:nth-child(even){padding-inline:0;border-left:0}}

/* contact */
.contact{border-top:1px solid var(--line)}
.contact-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.contact h2{font-size:clamp(2.4rem,6vw,5.2rem);font-weight:850;font-stretch:118%;line-height:.94;letter-spacing:-.025em}
.contact p{color:var(--ink-2);max-width:44ch;margin:0 0 22px}
.mail{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.mail code{font-family:var(--f-mono);font-size:clamp(15px,1.6vw,19px);user-select:all;word-break:break-all;flex:1;min-width:0}
@media (max-width:820px){.contact-grid{grid-template-columns:1fr}}
footer{padding-block:28px;border-top:1px solid var(--line);color:var(--ink-2)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.noscript{padding:120px var(--gutter)}
/* name in nav */
.logo .short{display:none}
@media (max-width:460px){.logo .full{display:none}.logo .short{display:inline}}
/* impact strip */
.impact{border-bottom:1px solid var(--line);background:var(--panel)}
.impact-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{padding:28px 18px 26px 0;border-right:1px solid var(--line);min-width:0}
.kpi + .kpi{padding-left:18px}
.kpi:last-child{border-right:0}
.kpi-n{font-family:var(--f-display);font-weight:850;font-stretch:118%;font-size:clamp(2rem,3.4vw,3rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-l{font-size:14px;color:var(--ink-2);margin:10px 0 10px;max-width:22ch}
.kpi-s{font-size:10.5px;color:var(--route)}
@media (max-width:1100px){.impact-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi{border-bottom:1px solid var(--line)}.kpi:nth-child(3n){border-right:0}.kpi:nth-child(3n+1){padding-left:0}}
@media (max-width:560px){.impact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3n){border-right:1px solid var(--line)}.kpi:nth-child(2n){border-right:0}.kpi:nth-child(3n+1){padding-left:18px}.kpi:nth-child(2n+1){padding-left:0}}
.meta .spec{grid-template-columns:repeat(2,minmax(0,1fr))}
.spec dd.hit{color:var(--signal);font-weight:600}

/* about label */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:clamp(32px,6vw,96px);align-items:center}
.about h2{font-size:clamp(2rem,4vw,3.4rem);font-weight:820;font-stretch:115%;line-height:1;letter-spacing:-.02em;margin-bottom:22px}
.about-copy p{color:var(--ink-2);max-width:52ch;margin:0 0 14px}
.label{position:relative;margin:0;background:var(--panel);border:2.5px solid var(--ink);border-radius:4px;transform:rotate(-1.2deg);box-shadow:10px 12px 0 -2px rgba(14,27,44,.12);transition:transform .4s}
.label:hover{transform:rotate(0)}
.lbl-top{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--ink);color:var(--paper)}
.lbl-row{display:grid;border-top:2px solid var(--ink)}
.lbl-row.two{grid-template-columns:1.4fr 1fr}.lbl-row.three{grid-template-columns:repeat(3,1fr)}
.lbl-row > div{padding:12px 16px;display:grid;gap:2px;min-width:0}
.lbl-row > div + div{border-left:2px solid var(--ink)}
.lbl-row .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.lbl-row strong{font-family:var(--f-display);font-stretch:110%;font-weight:750;font-size:16px;line-height:1.2}
.lbl-row span:not(.k){font-size:13px;color:var(--ink-2)}
.lbl-row strong.big{font-size:34px;font-stretch:120%;color:var(--route)}
.lbl-bar{border-top:2px solid var(--ink);padding:14px 16px 12px;display:grid;gap:6px}
.barcode{width:100%;height:54px;fill:var(--ink)}
.lbl-bar .mono{letter-spacing:.4em;text-align:center}
.stamp{position:absolute;right:22px;bottom:26px;font:800 15px/1.05 var(--f-display);font-stretch:120%;text-transform:uppercase;letter-spacing:.06em;color:var(--signal);border:3px solid var(--signal);border-radius:4px;padding:8px 10px;transform:rotate(9deg);opacity:.9;background:color-mix(in srgb,var(--panel) 75%,transparent)}
@media (max-width:900px){.about-grid{grid-template-columns:1fr}.label{transform:none}}
@media (max-width:520px){.lbl-row.two,.lbl-row.three{grid-template-columns:1fr}.lbl-row > div + div{border-left:0;border-top:1px dashed var(--line)}.stamp{bottom:auto;top:58px;right:12px;font-size:12px;padding:6px 8px}}
/* forecast game */
.fx{background:var(--panel);border-block:1px solid var(--line)}
.fx-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:clamp(24px,4vw,48px);align-items:start}
.fx-chart{min-width:0}
.fx-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pill{font:500 13px var(--f-body);padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.pill:hover{border-color:var(--ink)} .pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fx-tag{margin-left:auto;font-size:10.5px;color:var(--ink-2)}
.fx svg{touch-action:none;min-width:0}
.act-line{fill:none;stroke:var(--ink);stroke-width:2.2}
.act-dot{fill:var(--ink)}

<script>
/* =========================================================
   1. THREE.JS WORLD KIT — low-poly logistics props
   ========================================================= */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Global motion mode and colour palette */
const MODE={auto:!REDUCED, subs:new Set(), set(v){ this.auto=v; document.documentElement.setAttribute('data-mode',v?'auto':'manual'); this.subs.forEach(f=>f(v)); }};
document.documentElement.setAttribute('data-mode',MODE.auto?'auto':'manual');
const PALETTES={day:{bg:0xeef1f5,sun:[0xffffff,.72],hemi:.9,tint:null},dusk:{bg:0xf4e8df,sun:[0xffc39a,.82],hemi:.82,tint:[0xf0c2a4,.22]},night:{bg:0x0b1424,sun:[0xa8bfff,.55],hemi:.62,tint:[0x15233b,.6]}};
let PAL=(()=>{ try{ const v=localStorage.getItem('cbb-palette'); if(PALETTES[v]) return v; }catch(e){}
  const t=document.documentElement.getAttribute('data-theme'); if(t==='dark') return 'night'; if(t==='light') return 'day';

/* Port set: crane cycle moving containers quay → vessel, on a 10 s loop */
const CRANE_KEYS=[[0,3,7.2],[1.5,3,1.3],[3,3,7.2],[5.5,-6,7.2],[7,-6,3.7],[8.5,-6,7.2],[10,3,7.2]];
function craneState(t){
  for(let i=0;i<CRANE_KEYS.length-1;i++){ const a=CRANE_KEYS[i], b=CRANE_KEYS[i+1];
    if(t<=b[0]){ const f=ease((t-a[0])/(b[0]-a[0])); return {z:lerp(a[1],b[1],f), y:lerp(a[2],b[2],f)}; } }
  return {z:3,y:7.2};
}
function makePort(scene, origin, r){
  const crane=makeCrane(); crane.group.position.copy(origin); scene.add(crane.group);
  const ship=makeShip(r); ship.group.position.set(origin.x,-.25,origin.z-6); scene.add(ship.group);
  const cargo=makeContainer(C.orange); scene.add(cargo);
  let last=-1;
  return wt=>{
    const cyc=Math.floor(wt/10), t=wt%10;
    if(cyc!==last){ last=cyc; cargo.material=M(BOX_COLORS[(cyc+1)%BOX_COLORS.length]); }
    const s=craneState(t);
    crane.trolley.position.z=s.z; crane.spreader.position.set(0,s.y,s.z);
    for(const c of crane.cables){ const top=8.2, bot=s.y+.125; c.scale.y=Math.max(.01,top-bot); c.position.y=(top+bot)/2; c.position.z=s.z; }
    ship.group.position.y=-.25+Math.sin(wt*.8)*.05; ship.group.rotation.x=Math.sin(wt*.6)*.006;
    if(t<1.5){ cargo.visible=true; cargo.position.set(origin.x,.61,origin.z+3); }
    else if(t<7){ cargo.visible=true; cargo.position.set(origin.x,s.y-.675,origin.z+s.z); }
    else { cargo.visible=false; ship.drop.visible=true; ship.drop.material=cargo.material; }
  };
}
/* Drone fleet: hub → rooftop drop → doorstep parcel → back, 9 s per sortie */
function makeDroneFleet(scene, hub, houses, n){
  const drones=[];
  for(let i=0;i<n;i++){
    const d=makeDrone(); scene.add(d.group);
    const left=box(.45,.42,.45,C.sand); left.visible=false; scene.add(left);
    drones.push({...d,left});
  }
  const tmp=new THREE.Vector3();
  return wt=>{
    drones.forEach((d,i)=>{
      const T=wt+i*3, s=(T%9)/9, cyc=Math.floor(T/9);
      const h=houses[(cyc*n+i*2)%houses.length];
      const H=hub, top=h.top, cruise=top.y+2.2;
      let x,y,z, carrying=true;
      if(s<.4){ const f=ease(s/.4); x=lerp(H.x,top.x,f); z=lerp(H.z,top.z,f); y=lerp(H.y,cruise,f)+Math.sin(f*Math.PI)*4; }
      else if(s<.5){ const f=ease((s-.4)/.1); x=top.x; z=top.z; y=lerp(cruise,top.y+1,f); }
      else if(s<.6){ const f=ease((s-.5)/.1); x=top.x; z=top.z; y=lerp(top.y+1,cruise,f); carrying=false; }
      else { const f=ease((s-.6)/.4); x=lerp(top.x,H.x,f); z=lerp(top.z,H.z,f); y=lerp(cruise,H.y,f)+Math.sin(f*Math.PI)*4; carrying=s>.97; }
      d.group.position.set(x,y,z);
      tmp.set(top.x-H.x,0,top.z-H.z); d.group.rotation.y=Math.atan2(-tmp.z,tmp.x)+(s>.6?Math.PI:0);
      d.group.rotation.z=(s<.4||s>.6)?-.12:0;
      d.parcel.visible=carrying;
      d.left.visible = s>=.5 && s<.95; d.left.position.copy(h.door);
      d.rotors.forEach((r,k)=>r.rotation.y=wt*40+k);
    });
  };
}

function crateTex(text,bg,code){
  const c=document.createElement('canvas'); c.width=640; c.height=320; const g=c.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,640,320);
  g.strokeStyle='rgba(14,27,44,.3)'; g.lineWidth=8; g.strokeRect(16,16,608,288);
  g.fillStyle='rgba(14,27,44,.6)'; g.font='500 26px "IBM Plex Mono", monospace'; g.textAlign='left'; g.fillText(code,40,62);
  g.fillStyle='#0E1B2C'; g.textAlign='center'; g.textBaseline='middle';
  let size=74, lines;
  do { g.font='800 '+size+'px "Archivo", "IBM Plex Sans", Arial, sans-serif'; lines=[]; let line='';
    for(const w of text.split(' ')){ const t=line?line+' '+w:w; if(g.measureText(t).width>560&&line){ lines.push(line); line=w; } else line=t; }
    lines.push(line); size-=4; } while((lines.length>2 || lines.some(l=>g.measureText(l).width>580)) && size>34);
  lines.forEach((l,i,a)=>g.fillText(l,320,182+(i-(a.length-1)/2)*(size+10)));
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=16; return tex;
}
function signTex(top,bottom){

  g.fillStyle='#0E1B2C'; g.fillRect(0,0,1024,256);

  g.fillStyle='#EEF1F5'; let sz=72; g.font='800 '+sz+'px "Archivo", Arial, sans-serif';

}

/* Stage: one renderer per canvas, runs only while visible */

  const scene=new THREE.Scene(); scene.background=new THREE.Color(bg);
  const camera=new THREE.PerspectiveCamera(fov,1,.1,500);

  const _o=new THREE.Vector3();
  st.aim=(px,py,pz,tx,ty,tz)=>{

  let drag=null;
  canvas.addEventListener('pointerdown',e=>{ if(MODE.auto) return; drag={x:e.clientX,y:e.clientY}; try{canvas.setPointerCapture(e.pointerId);}catch(_){} canvas.classList.add('grabbing'); });

  const dragEnd=()=>{ drag=null; canvas.classList.remove('grabbing'); };
  canvas.addEventListener('pointerup',dragEnd); canvas.addEventListener('pointercancel',dragEnd);
  STAGES.add(st);
  let raf=0,last=0,visible=false;
  function render(){ renderer.render(scene,camera); }
  function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); st.onResize&&st.onResize(w/h); if(!st.running){ st.update(0); render(); } }
  function frame(now){ raf=requestAnimationFrame(frame); const dt=Math.max(0,Math.min(.05,(now-last)/1000||0)); last=now; st.update(st.playing?dt:0,dt); render(); }
  st.start=()=>{ if(st.running||!visible) return; st.running=true; last=performance.now(); raf=requestAnimationFrame(frame); };
  st.stop=()=>{ st.running=false; cancelAnimationFrame(raf); };
  st.step=dt=>{ st.update(dt,dt); render(); };
  const ro=new ResizeObserver(resize); ro.observe(canvas);
  const io=new IntersectionObserver(([e])=>{ visible=e.isIntersecting; if(visible&&st.wantRun) st.start(); else st.stop(); },{threshold:.02}); io.observe(canvas);
  st.dispose=()=>{ st.stop(); ro.disconnect(); io.disconnect(); STAGES.delete(st); renderer.dispose(); };
  return st;
}

/* =========================================================

const CHAPTERS=[
  {name:'Inventory', code:'SCN 01', meta:'Line-side stock · ABC-FSN · cycle counts', pos:[-6,17,28], target:[-30,1.5,-4]},
  {name:'Replenishment', code:'SCN 02', meta:'Forecast → net requirements → replenishment plan', follow:true},

  {name:'End to end', code:'SCN 05', meta:'SAP S/4HANA · IBP · Power BI · weekly planning cycles', pos:[4,66,70], target:[2,0,5]},

const CH_LEN=7, FILM_LEN=CH_LEN*CHAPTERS.length;

function createHeroFilm(canvas,cb){

  const ROAD=new THREE.CatmullRomCurve3(pts.map(([x,z])=>new THREE.Vector3(x,0,z)),true,'centripetal');
  scene.add(ribbon(ROAD,4.2,C.road,.05,420));
  for(let i=0;i<170;i++){ const u=i/170, p=ROAD.getPointAt(u), t=ROAD.getTangentAt(u); const d=box(1.1,.02,.16,C.lane,p.x,.08,p.z); d.rotation.y=Math.atan2(-t.z,t.x); d.castShadow=false; scene.add(d); }
  const roadPts=ROAD.getSpacedPoints(200);

  // warehouse + dock + conveyor
  const wh=makeWarehouse(); wh.position.set(-34,0,-6); scene.add(wh);
  for(const x of [-38.5,-35.5]){ const t=makeTruck(C.navy); t.position.set(x,0,1.3); t.rotation.y=-Math.PI/2; scene.add(t); }
  scene.add(box(10,.25,1.3,C.steel,-22,1.0,-4));

  for(let i=0;i<4;i++) scene.add(box(1.4,.15,1.4,C.pallet,-24+i*2.2,.08,-9.5)), scene.add(box(1.2,1,1.2,i%2?C.sand:C.white,-24+i*2.2,.65,-9.5));

  for(const xs of [[25,28,31,34],[46,49,52,55]]) for(const x of xs) for(const z of [-3.6,-4.8,-6,-7.2,-8.4]){
    const n=1+Math.floor(r()*3); for(let l=0;l<n;l++){ const c=makeContainer(BOX_COLORS[Math.floor(r()*BOX_COLORS.length)]); c.position.set(x,.61+l*1.1,z); scene.add(c); }

  // trucks on the loop

  const roadLen=ROAD.getLength();

  // network arcs (visible in scene 5)
  const nodes=[new THREE.Vector3(-34,6,-6),new THREE.Vector3(40,10,-7),new THREE.Vector3(2,1.5,13)];
  const arcMat=new THREE.MeshBasicMaterial({color:C.teal,transparent:true,opacity:0,depthWrite:false});
  const arcs=nodes.map((a,i)=>{ const b=nodes[(i+1)%3]; const mid=a.clone().add(b).multiplyScalar(.5); mid.y=22;
    const c=new THREE.QuadraticBezierCurve3(a,mid,b); scene.add(new THREE.Mesh(new THREE.TubeGeometry(c,64,.18,6),arcMat)); return c; });
  const pulseMat=new THREE.MeshBasicMaterial({color:C.orange,transparent:true,opacity:0});
  const pulses=[]; arcs.forEach(c=>{ for(let k=0;k<3;k++){ const m=new THREE.Mesh(new THREE.SphereGeometry(.55,10,8),pulseMat); scene.add(m); pulses.push({c,k,m}); } });
  const nodeRings=nodes.map(n=>{ const m=new THREE.Mesh(new THREE.TorusGeometry(2.4,.12,6,32),arcMat); m.rotation.x=Math.PI/2; m.position.set(n.x,.4,n.z); scene.add(m); return m; });

  // camera direction
  let filmT=REDUCED?CH_LEN*4:0, wt=0, playing=!REDUCED, lastCh=-1, blend=1;
  const fromPos=new THREE.Vector3(), fromTgt=new THREE.Vector3(), curTgt=new THREE.Vector3(), basePos=new THREE.Vector3();
  let aspect=1.6;
  st.onResize=a=>{ aspect=a; const w=canvas.clientWidth,h=canvas.clientHeight;
    if(a>1.3) camera.setViewOffset(w,h,-w*.15,0,w,h); else camera.clearViewOffset(); };
  const tmp={pos:new THREE.Vector3(),target:new THREE.Vector3()};
  function dest(i,sec){
    const ch=CHAPTERS[i], zoom=aspect<1?1.55:aspect<1.3?1.2:1;
    if(ch.follow){
      const tr=trucks[0], fwd=new THREE.Vector3(Math.cos(tr.rotation.y),0,-Math.sin(tr.rotation.y)), right=new THREE.Vector3(-fwd.z,0,fwd.x);
      tmp.target.copy(tr.position).addScaledVector(fwd,5).add(new THREE.Vector3(0,1,0));
      tmp.pos.copy(tr.position).addScaledVector(fwd,-10*zoom).addScaledVector(right,6*zoom).add(new THREE.Vector3(0,6*zoom,0));
    } else {
      tmp.target.set(...ch.target);
      const off=new THREE.Vector3(...ch.pos).sub(tmp.target).multiplyScalar(zoom).applyAxisAngle(UP,sec*.035);
      tmp.pos.copy(tmp.target).add(off);
    }
    return tmp;
  }
  st.update=dt=>{
    const fdt=playing?dt:0;
    filmT=(filmT+fdt)%FILM_LEN; wt+=fdt;
    const ch=Math.floor(filmT/CH_LEN), local=filmT-ch*CH_LEN;
    // world
    parcels.forEach((p,i)=>{ const x=-17-((wt*1.4+i*1.25)%10); p.position.set(x,1.4,-4); p.visible=x>-26.6; });
    trucks.forEach((t,i)=>placeOnCurve(t,ROAD,((wt*8.5/roadLen)+i/3)%1,1.05));
    portUpdate(wt); fleet(wt);
    const netOn=ch===4?1:0;
    arcMat.opacity=lerp(arcMat.opacity,netOn*.85,Math.min(1,(dt||.016)*3)); pulseMat.opacity=arcMat.opacity;
    pulses.forEach(({c,k,m})=>m.position.copy(c.getPointAt(((wt*.22)+k/3)%1)));
    nodeRings.forEach((m,i)=>{ const s=1+.15*Math.sin(wt*3+i); m.scale.set(s,s,s); });
    // camera
    if(ch!==lastCh){
      if(lastCh===-1 || !st.running){ const d=dest(ch,local); fromPos.copy(d.pos); fromTgt.copy(d.target); }
      else { fromPos.copy(basePos); fromTgt.copy(curTgt); }
      blend=0; lastCh=ch; cb.onChapter&&cb.onChapter(ch);
    }
    blend=Math.min(1,blend+(dt||0)/2.4);
    const d=dest(ch,local), k=ease(blend);
    basePos.lerpVectors(fromPos,d.pos,k); curTgt.lerpVectors(fromTgt,d.target,k); st.aim(basePos.x,basePos.y,basePos.z,curTgt.x,curTgt.y,curTgt.z);
    cb.onProgress&&cb.onProgress(ch,local/CH_LEN,filmT);
  };
  styleStage(st);
  return {
    play(){ playing=true; st.wantRun=true; st.start(); },
    pause(){ playing=false; },
    jumpTo(x){ filmT=Math.max(0,Math.min(FILM_LEN-.01,x*CH_LEN+.001)); if(!st.running){ lastCh=-1; st.step(0); } },
    isPlaying:()=>playing,
    dispose:()=>st.dispose()
  };
}

/* Case 01: the weekly demand & supply planning cycle, told in five stages */
const PLAN_PHASES=['Review demand history: seasonality, promotions and bias','Build the consensus forecast','Translate it into net requirements in SAP S/4HANA and IBP','Set replenishment plans and inventory targets','Resolve SKU exceptions in the weekly review (250+ SKUs)'];

function buildPlanning(st){
  const {scene}=st; const r=rng(5);

  const unit=new THREE.BoxGeometry(1,1,1); unit.translate(0,.5,0);

  const hist=[], fcst=[]; const H=i=>1.4+.7*Math.sin(i/20*Math.PI*3-1)+i*.035;
  for(let i=0;i<20;i++){ const promo=i===6||i===15; const h=H(i)+(promo?1.3:0); const m=new THREE.Mesh(unit,bm(promo?C.orange:C.teal)); m.position.set(-26+i*.62,.12,0); m.scale.set(.42,h,.42); m.castShadow=true; scene.add(m); hist.push({m,h}); }
  for(let i=0;i<8;i++){ const h=H(20+i); const m=new THREE.Mesh(unit,bm(C.teal,.4)); m.position.set(-26+(20+i)*.62+.25,.12,0); m.scale.set(.42,h,.42); scene.add(m); fcst.push({m,h}); }
  for(let y=.4;y<4.4;y+=.5) scene.add(box(.07,.28,.07,C.slate,-26+19.5*.62+.12,y,0));
  const cPts=fcst.map(f=>new THREE.Vector3(f.m.position.x,.12+f.h+.35,0)); const cCurve=new THREE.CatmullRomCurve3(cPts);
  const cMat=new THREE.MeshBasicMaterial({color:C.navy,transparent:true,opacity:0}); scene.add(new THREE.Mesh(new THREE.TubeGeometry(cCurve,60,.07,6),cMat));
  const cDots=cPts.map(p=>{ const d=new THREE.Mesh(new THREE.SphereGeometry(.14,10,8),cMat); d.position.copy(p); scene.add(d); return d; });
  // 3: planning engine
  scene.add(box(7,1.4,4.5,C.navy,0,.7,0));
  const top=new THREE.Mesh(new THREE.PlaneGeometry(6.6,3.3),new THREE.MeshBasicMaterial({map:labelTex(['PLANNING ENGINE','SAP S/4HANA','+ IBP · MRP'])})); top.rotation.x=-Math.PI/2; top.position.set(0,1.42,0); scene.add(top);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,.1,8,48),new THREE.MeshBasicMaterial({color:C.teal})); ring.position.set(0,3,0); ring.rotation.x=Math.PI/2; scene.add(ring);
  const inC=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-8.4,3.6,0),new THREE.Vector3(-4.5,5.5,0),new THREE.Vector3(-.5,1.8,0));
  const outC=new THREE.QuadraticBezierCurve3(new THREE.Vector3(3.6,1.4,0),new THREE.Vector3(7.5,4.5,1),new THREE.Vector3(11.2,2,2.6));
  const parts=[]; for(let k=0;k<10;k++){ parts.push({c:inC,m:new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),new THREE.MeshBasicMaterial({color:C.teal})),k}); parts.push({c:outC,m:new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),new THREE.MeshBasicMaterial({color:C.orange})),k}); }
  parts.forEach(p=>scene.add(p.m));
  // 4: DC, SKU stock columns vs target, trucks to stores
  const wh=makeWarehouse(); wh.scale.setScalar(.55); wh.position.set(15,0,-2.2); scene.add(wh);
  const cols=[]; const bx=.6;
  for(let i=0;i<5;i++){ const boxes=[]; for(let l=0;l<9;l++){ const b=box(bx,bx*.9,bx,C.teal,11.4+i*.95,.27+l*bx*.9,4); b.visible=false; scene.add(b); boxes.push(b); } cols.push({boxes,from:3,cur:3}); }
  const target=5; const tl=box(5.2,.05,.05,C.orange,11.4+1.9,.27+target*bx*.9-.27+.02,4.35); tl.material=new THREE.MeshBasicMaterial({color:C.orange}); scene.add(tl);
  const road=box(16,.04,2.6,C.road,25,.02,1.5); road.castShadow=false; scene.add(road);
  const stores=[[33,-1.2],[33,4.2]].map(([x,z])=>{ const g=new THREE.Group(); g.add(box(2.4,1.4,2,C.white,0,.7,0)); g.add(box(2.6,.22,.7,C.orange,0,1.3,1.1)); g.position.set(x,0,z); scene.add(g); return g; });
  const trucks=[0,1].map(i=>{ const t=makeTruck(i?C.teal:C.orange,C.white); t.scale.setScalar(.55); t.position.set(19,0,i?2.2:.8); scene.add(t); return t; });
  // 5: SKU exception grid (16 x 16 = 256)
  scene.add(box(8.2,.2,8.2,C.navy,26,.1,-9));
  const teal=new THREE.MeshStandardMaterial({color:C.teal,roughness:.6}), org=new THREE.MeshBasicMaterial({color:C.orange});
  const tiles=[]; for(let i=0;i<256;i++){ const t=new THREE.Mesh(boxGeo(.4,.12,.4),teal); t.position.set(26-3.75+(i%16)*.5,.26,-9-3.75+Math.floor(i/16)*.5); scene.add(t); tiles.push(t); }
  let exc=[];
  // camera keys per stage
  const KEYS=[[[-16.5,7.5,17],[-17.6,1.8,0]],[[-8.5,6,14],[-13.5,2.3,0]],[[3.5,7.5,10.5],[0,1.4,0]],[[19,7,14],[15.5,1.6,2]],[[26,12,3.5],[26,0,-8.6]]];
  const PH=4.2, LOOP=PH*5; let wt=0, lastLoop=-1, lastPh=-1;
  const cam=new THREE.Vector3(), tgt=new THREE.Vector3(), a=new THREE.Vector3(), b=new THREE.Vector3();
  let zoom=1; st.onResize=asp=>{ zoom=asp<1?1.6:asp<1.4?1.2:1; };
  st.update=(dt)=>{
    wt+=dt; const loop=Math.floor(wt/LOOP), t=wt-loop*LOOP, ph=Math.min(4,Math.floor(t/PH)), lt=t-ph*PH;
    if(loop!==lastLoop){ lastLoop=loop;
      cols.forEach(c=>{ c.from=[2,8,3,7,4][Math.floor(r()*5)]; });
      exc=[]; while(exc.length<20){ const k=Math.floor(r()*256); if(!exc.includes(k)) exc.push(k); }

    if(ph!==lastPh){ lastPh=ph; st.onPhase&&st.onPhase(ph); }
    // chart grows during stage 1, forecast + consensus appear in stage 2
    hist.forEach((o,i)=>{ const k=ph>0?1:ease(Math.max(0,Math.min(1,(lt-i*.09)/.6))); o.m.scale.y=Math.max(.01,o.h*k); });
    fcst.forEach((o,i)=>{ const k=ph>1?1:ph<1?0:ease(Math.max(0,Math.min(1,(lt-.3-i*.12)/.6))); o.m.scale.y=Math.max(.01,o.h*k); o.m.visible=k>0; });
    cMat.opacity=ph>1?1:ph<1?0:Math.max(0,Math.min(1,(lt-1.4)/.8));
    // data flow
    ring.rotation.z+=dt*1.5; ring.scale.setScalar(1+(ph===2?.12*Math.sin(wt*6):0));
    parts.forEach(p=>{ const on=p.c===inC?(ph>=2):(ph>=2); p.m.visible=on; if(on) p.m.position.copy(p.c.getPointAt(((wt*.45)+p.k/10)%1)); });
    // inventory to target, trucks out
    cols.forEach(c=>{ const k=ph<3?0:ph>3?1:ease(Math.min(1,lt/2.2)); const n=Math.round(lerp(c.from,target,k));
      c.boxes.forEach((b,l)=>{ b.visible=l<n; b.material=M(l>=target?C.orange:C.teal); }); });
    trucks.forEach((tr,i)=>{ const k=ph<3?0:ph>3?1:Math.max(0,Math.min(1,(lt-1-i*.5)/2.6)); tr.position.x=lerp(19,31,ease(k)); });
    // exceptions light up, then resolve
    tiles.forEach(t=>t.material=teal);
    if(ph>=4){ const solved=Math.floor(Math.max(0,lt-.8)/2.8*exc.length); exc.forEach((k,j)=>{ if(j>=solved) tiles[k].material=org; }); tiles.forEach((t,i)=>t.position.y=.26); exc.forEach((k,j)=>{ if(j>=solved) tiles[k].position.y=.26+.12*Math.abs(Math.sin(wt*5+j)); }); }
    else if(ph===3) exc.forEach(k=>tiles[k].material=org);
    // camera
    const prev=KEYS[(ph+4)%5], cur=KEYS[ph]; const kb=ph===0&&loop===0?1:ease(Math.min(1,lt/1.3));
    a.set(...prev[0]); b.set(...cur[0]); cam.lerpVectors(a,b,kb); a.set(...prev[1]); b.set(...cur[1]); tgt.lerpVectors(a,b,kb);
    cam.sub(tgt).multiplyScalar(zoom).add(tgt); cam.x+=Math.sin(wt*.4)*.4;
    st.aim(cam.x,cam.y,cam.z,tgt.x,tgt.y,tgt.z);
  };
  st.gotoPhase=i=>{ const loop=Math.floor(wt/LOOP); wt=loop*LOOP+i*PH+(i===4?2.0:PH-.25); if(!st.running) st.step(0); };
}

const UNIT=(()=>{ const g=new THREE.BoxGeometry(1,1,1); g.translate(0,.5,0); return g; })();
function barMesh(color,x,z,w=1.2){ const m=new THREE.Mesh(UNIT,new THREE.MeshStandardMaterial({color,roughness:.7})); m.position.set(x,0,z); m.scale.set(w,1,w); m.castShadow=true; return m; }
function runStory(st,{keys,ph=4.2,start,frame,gotoLt}){
  const n=keys.length, LOOP=ph*n; let wt=0,lastLoop=-1,lastPh=-1,zoom=1;
  const cam=new THREE.Vector3(),tgt=new THREE.Vector3(),a=new THREE.Vector3(),b=new THREE.Vector3();
  st.onResize=asp=>{ zoom=asp<1?1.6:asp<1.4?1.2:1; };
  st.update=dt=>{
    wt+=dt; const loop=Math.floor(wt/LOOP), t=wt-loop*LOOP, p=Math.min(n-1,Math.floor(t/ph)), lt=t-p*ph;
    if(loop!==lastLoop){ lastLoop=loop; start&&start(loop); st.onCycle&&st.onCycle(loop%12+1); }
    if(p!==lastPh){ lastPh=p; st.onPhase&&st.onPhase(p); }
    frame(p,lt,wt,dt);
    const prev=keys[(p+n-1)%n], cur=keys[p], kb=p===0&&loop===0?1:ease(Math.min(1,lt/1.3));
    a.set(...prev[0]); b.set(...cur[0]); cam.lerpVectors(a,b,kb); a.set(...prev[1]); b.set(...cur[1]); tgt.lerpVectors(a,b,kb);
    cam.sub(tgt).multiplyScalar(zoom).add(tgt); cam.x+=Math.sin(wt*.4)*.35;
    st.aim(cam.x,cam.y,cam.z,tgt.x,tgt.y,tgt.z);

}
function resultBars(scene,x,before,after,label){
  const b1=barMesh(C.navy,x-1.3,0), b2=barMesh(C.orange,x+1.3,0); b1.scale.y=before; b2.scale.y=before; scene.add(b1,b2);

  const t2=textPlane('After',2,{bg:'transparent',fg:'#0E1B2C'}); t2.position.set(x+1.3,.35,.95); scene.add(t2);

}

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ACTUAL=[820,760,850,900,985,1120,1245,1180,1010,940,1065,1385];
const LAST_YEAR=[742,768,786,881,893,1102,1135,1164,1003,856,1048,1262];
const METHODS={
  naive:{label:'Naive',f:()=>ACTUAL.map((_,i)=>i?ACTUAL[i-1]:LAST_YEAR[11])},
  ma3:{label:'3-month average',f:()=>ACTUAL.map((_,i)=>{ const h=[...LAST_YEAR,...ACTUAL]; const j=i+12; return Math.round((h[j-1]+h[j-2]+h[j-3])/3); })},
  seasonal:{label:'Seasonal × growth',f:()=>LAST_YEAR.map(v=>Math.round(v*1.055))},
};
function Forecast(){
  const [fc,setFc]=useState(()=>METHODS.ma3.f());
  const [method,setMethod]=useState('ma3');
  const svgRef=useRef(null), drag=useRef(-1); const [msg,setMsg]=useState(''); const anim=useRef(0);
  const autoTune=()=>{
    const h=[...LAST_YEAR,...ACTUAL]; const ma=ACTUAL.map((_,i)=>(h[i+11]+h[i+10]+h[i+9])/3);
    let best=null;
    for(let w=0;w<=1.0001;w+=.05) for(let g=.95;g<=1.12;g+=.005){ const f=ACTUAL.map((_,i)=>w*LAST_YEAR[i]*g+(1-w)*ma[i]); const e=f.reduce((a,v,i)=>a+Math.abs(v-ACTUAL[i])/ACTUAL[i],0)/12; if(!best||e<best.e) best={e,w,g,f}; }
    const from=fc.slice(), to=best.f.map(v=>Math.round(v/5)*5), t0=performance.now(); cancelAnimationFrame(anim.current);
    const stepA=now=>{ const k=REDUCED?1:Math.min(1,(now-t0)/1200), e=ease(k); setFc(from.map((v,i)=>Math.round(v+(to[i]-v)*e))); if(k<1) anim.current=requestAnimationFrame(stepA); };
    anim.current=requestAnimationFrame(stepA); setMethod('auto');
    const accR=100-to.reduce((x,v,i)=>x+Math.abs(v-ACTUAL[i])/ACTUAL[i],0)/12*100;
    setMsg(`Auto-tune searched ${21*35} blends and picked ${Math.round(best.w*100)}% seasonal, ${Math.round((1-best.w)*100)}% moving average, ${best.g>=1?'+':''}${((best.g-1)*100).toFixed(1)}% growth: ${accR.toFixed(1)}%. The last point to 97% is judgment. Can you find it by hand?`);
  };
  const W=680,H=300,pl=50,pr=14,pt=16,pb=34,ymax=1600;
  const X=i=>pl+i*(W-pl-pr)/11, Y=v=>pt+(1-v/ymax)*(H-pt-pb);
  const ape=ACTUAL.map((a,i)=>Math.abs(fc[i]-a)/a);
  const mape=ape.reduce((x,y)=>x+y,0)/12;
  const acc=Math.max(0,100-mape*100);
  const bias=(fc.reduce((x,y)=>x+y,0)-ACTUAL.reduce((x,y)=>x+y,0))/ACTUAL.reduce((x,y)=>x+y,0)*100;
  const worst=ape.indexOf(Math.max(...ape));
  const beat=acc>=97;

  const move=e=>{ if(drag.current<0) return; cancelAnimationFrame(anim.current); const v=toVal(e); setFc(f=>{ const n=f.slice(); n[drag.current]=v; return n; }); setMethod('custom'); };
  const end=()=>{ drag.current=-1; };
  const key=(i,e)=>{ const d=e.key==='ArrowUp'?10:e.key==='ArrowDown'?-10:0; if(!d) return; e.preventDefault(); setFc(f=>{ const n=f.slice(); n[i]=Math.max(200,Math.min(ymax,n[i]+d)); return n; }); setMethod('custom'); };
  const path=arr=>arr.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ');
  return html`<section className="block fx" id="forecast"><div className="wrap">
    <div className="sec-hd"><h2>Beat my forecast</h2><p>The consensus forecasts I support reached 97% monthly accuracy in review. Drag the orange points (or focus one and use the arrow keys) and see if you can match it.</p></div>
    <div className="fx-grid">

        <div className="fx-tools">
          ${Object.entries(METHODS).map(([k,m])=>html`<button key=${k} className=${'pill'+(method===k?' on':'')} onClick=${()=>{ cancelAnimationFrame(anim.current); setFc(m.f()); setMethod(k); setMsg(''); }}>${m.label}</button>`)}
          <span className="mono fx-tag">Sample data · one SKU family · 12 months</span>
        </div>
        <div className="chart-box">
          <svg ref=${svgRef} viewBox=${`0 0 ${W} ${H}`} onPointerMove=${move} onPointerUp=${end} onPointerLeave=${end} role="group" aria-label="Actual demand versus your forecast by month">
            ${[0,400,800,1200,1600].map(v=>html`<g key=${'g'+v}><line x1=${pl} x2=${W-pr} y1=${Y(v)} y2=${Y(v)} className="grid"/><text x=${pl-8} y=${Y(v)+4} textAnchor="end" className="ax">${v.toLocaleString()}</text></g>`)}
            ${MONTHS.map((m,i)=>html`<text key=${m} x=${X(i)} y=${H-10} textAnchor="middle" className="ax">${m}</text>`)}
            ${ACTUAL.map((a,i)=>html`<line key=${'e'+i} x1=${X(i)} x2=${X(i)} y1=${Y(a)} y2=${Y(fc[i])} className=${fc[i]>a?'err over':'err under'}/>`)}
            <path d=${path(ACTUAL)} className="act-line"/>
            ${ACTUAL.map((a,i)=>html`<circle key=${'a'+i} cx=${X(i)} cy=${Y(a)} r="4" className="act-dot"/>`)}
            <path d=${path(fc)} className="fc-line"/>
            ${fc.map((v,i)=>html`<g key=${'f'+i} className="handle" tabIndex="0" role="slider" aria-label=${MONTHS[i]+' forecast'} aria-valuenow=${v} aria-valuemin="200" aria-valuemax=${ymax}
                onPointerDown=${e=>{ drag.current=i; e.currentTarget.ownerSVGElement.setPointerCapture&&e.currentTarget.ownerSVGElement.setPointerCapture(e.pointerId); }} onKeyDown=${e=>key(i,e)}>
              <circle cx=${X(i)} cy=${Y(v)} r="18" className="hit"/><circle cx=${X(i)} cy=${Y(v)} r="7" className="fc-dot"/></g>`)}

/* ---- Safety stock lab ---- */
const Z={'90':1.2816,'95':1.6449,'97.5':1.96,'99':2.3263};
function gauss(r){ let u=0,v=0; while(!u)u=r(); while(!v)v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function simulate({d,sd,lt,slt,q,ss,rop}){
  const r=rng(2024), days=90; let inv=q+ss, orders=[], stockout=0, sum=0; const series=[];
  for(let t=0;t<days;t++){
    orders=orders.filter(o=>{ if(o.at<=t){ inv+=o.q; return false; } return true; });
    const dem=Math.max(0,d+sd*gauss(r)); const short=dem>inv; inv=Math.max(0,inv-dem); if(short) stockout++;
    const pos=inv+orders.reduce((a,o)=>a+o.q,0);
    if(pos<=rop) orders.push({q,at:t+Math.max(1,Math.round(lt+slt*gauss(r)))});
    sum+=inv; series.push(inv);
  }
  return {series,stockout,avg:sum/days};
}
function Field({id,label,unit,value,set,step=1,min=0}){
  return html`<label className="fld" htmlFor=${id}><span>${label}</span>
    <span className="fld-in"><input id=${id} type="number" inputMode="decimal" min=${min} step=${step} value=${value} onChange=${e=>set(e.target.value)}/><em>${unit}</em></span></label>`;
}
function Lab(){
  const [d,setD]=useState('120'), [sd,setSd]=useState('30'), [lt,setLt]=useState('7'), [slt,setSlt]=useState('1.5'), [q,setQ]=useState('1200'), [sl,setSl]=useState('95');
  const [optMsg,setOptMsg]=useState('');
  const n=v=>Math.max(0,parseFloat(v)||0);
  const optimize=()=>{
    const base={d:n(d),sd:n(sd),lt:n(lt),slt:n(slt)}; let best=null; const cur=sim;
    for(const k2 of ['90','95','97.5','99']) for(let qq=200;qq<=4000;qq+=100){
      const z2=Z[k2], ss2=z2*Math.sqrt(base.lt*base.sd*base.sd+base.d*base.d*base.slt*base.slt), rop2=base.d*base.lt+ss2;
      const r2=simulate({...base,q:qq,ss:ss2,rop:rop2}); const score=r2.stockout*1e6+r2.avg;
      if(!best||score<best.score) best={score,k2,qq,r2};
    }
    setSl(best.k2); setQ(String(best.qq));
    const delta=cur.avg?((best.r2.avg-cur.avg)/cur.avg*100):0;
    setOptMsg(`Optimizer tested ${4*39} policies and picked ${best.k2}% service with orders of ${best.qq.toLocaleString()} units: ${best.r2.stockout} stockout days, average stock ${Math.round(best.r2.avg).toLocaleString()} units in this 90-day run (${delta>=0?'+':''}${delta.toFixed(0)}% vs your setting).`);
  };
  const P={d:n(d),sd:n(sd),lt:n(lt),slt:n(slt),q:Math.max(1,n(q))};
  const z=Z[sl];
  const ss=z*Math.sqrt(P.lt*P.sd*P.sd+P.d*P.d*P.slt*P.slt);
  const rop=P.d*P.lt+ss;
  const sim=useMemo(()=>simulate({...P,ss,rop}),[d,sd,lt,slt,q,sl]);
  const W=640,H=240,pl=48,pr=12,pt=14,pb=28;
  const ymax=Math.max(rop,...sim.series)*1.1||1;
  const X=i=>pl+(i/89)*(W-pl-pr), Y=v=>pt+(1-v/ymax)*(H-pt-pb);
  const path=sim.series.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=path+` L${X(89)} ${Y(0)} L${X(0)} ${Y(0)} Z`;
  const yt=[0,.25,.5,.75,1].map(f=>Math.round(ymax*f/10)*10);
  const k=v=>Math.round(v).toLocaleString();
  return html`<section className="block lab" id="lab"><div className="wrap">
    <div className="sec-hd"><h2>Safety stock lab</h2><p>The method from my inventory optimization project, live. Change demand, lead time or service level and the 90-day simulation reruns instantly.</p></div>
    <div className="lab-grid">
      <form className="lab-form" onSubmit=${e=>e.preventDefault()}>
        <${Field} id="d" label="Average daily demand" unit="units" value=${d} set=${setD}/>
        <${Field} id="sd" label="Demand std. deviation" unit="units" value=${sd} set=${setSd}/>
        <${Field} id="lt" label="Average lead time" unit="days" value=${lt} set=${setLt} step="0.5"/>
        <${Field} id="slt" label="Lead-time std. deviation" unit="days" value=${slt} set=${setSlt} step="0.5"/>
        <${Field} id="q" label="Order quantity" unit="units" value=${q} set=${setQ} step="50" min="1"/>
        <div className="fld"><span>Target service level</span>
          <div className="seg-ctl" role="radiogroup" aria-label="Target service level">${['90','95','97.5','99'].map(k2=>html`<button type="button" key=${k2} role="radio" aria-checked=${sl===k2} className=${sl===k2?'on':''} onClick=${()=>setSl(k2)}>${k2}%</button>`)}</div></div>
        <p className="formula mono">SS = z · √(LT·σd² + d²·σLT²)<br/>ROP = d · LT + SS</p>
        <div className="lab-auto"><button type="button" className="btn small auto" onClick=${optimize}>⚙ Auto-optimize policy</button></div>
        ${optMsg?html`<p className="auto-msg" aria-live="polite">${optMsg}</p>`:null}
      </form>
      <div className="lab-out">
        <div className="out-row">
          <div><span className="mono">Safety stock</span><strong>${k(ss)}</strong><em>units · z = ${z.toFixed(2)}</em></div>
          <div><span className="mono">Reorder point</span><strong>${k(rop)}</strong><em>units</em></div>
          <div><span className="mono">Stockout days</span><strong className=${sim.stockout?'warn':'ok'}>${sim.stockout}</strong><em>of 90 simulated</em></div>
          <div><span className="mono">Avg. on hand</span><strong>${k(sim.avg)}</strong><em>units</em></div>
        </div>
        <div className="chart-box">
          <svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Simulated on-hand inventory over 90 days with reorder point and safety stock lines">
            ${yt.map(v=>html`<g key=${'y'+v}><line x1=${pl} x2=${W-pr} y1=${Y(v)} y2=${Y(v)} className="grid"/><text x=${pl-8} y=${Y(v)+4} textAnchor="end" className="ax">${k(v)}</text></g>`)}
            ${[0,30,60,89].map(i=>html`<text key=${'x'+i} x=${X(i)} y=${H-8} textAnchor=${i===0?'start':i===89?'end':'middle'} className="ax">Day ${i+1}</text>`)}
            <path d=${area} className="inv-area"/>
            <path d=${path} className="inv-line"/>
            <line x1=${pl} x2=${W-pr} y1=${Y(rop)} y2=${Y(rop)} className="rop"/>
            <line x1=${pl} x2=${W-pr} y1=${Y(ss)} y2=${Y(ss)} className="ss"/>
            <text x=${W-pr-4} y=${Y(rop)-6} textAnchor="end" className="lbl-rop">Reorder point</text>
            <text x=${W-pr-4} y=${Y(ss)-6} textAnchor="end" className="lbl-ss">Safety stock</text>
          </svg>
        </div>
        <p className="note">Demand and lead time are drawn at random around your inputs (fixed seed), with continuous review: an order goes out whenever stock on hand plus on order falls to the reorder point.</p>
      </div>
    </div>
  </div></section>`;
}

    </div>`:null}
  </div>`;
}

function App(){ return html`<${Nav}/><main><${Hero}/><${Impact}/><${About}/><${Experience}/><${Work}/><${Band}/><${HowIWork}/><${Notebook}/><${Forecast}/><${Lab}/><${Skills}/><${Contact}/></main>
  <${Tracker}/><${QuickView}/>
  <${Console}/>
  <footer><div className="wrap mono"><span>© 2026 ${ME.name}</span><span>Real-time 3D · Three.js + React</span></div></footer>`; }

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body>
</html>
